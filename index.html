<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Please wait</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .box {
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 30px #0002;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 4px solid #ddd;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="box">
    <div class="spinner"></div>
    <h1>Please wait</h1>
    <p>Continuing in <span id="seconds">5</span> seconds...</p>
  </main>

  <script>
    const destination = "https://example.com/your-destination";
    let seconds = 5;

    const counter = document.getElementById("seconds");

    const timer = setInterval(() => {
      seconds--;
      counter.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);
  </script>
</body>
</html>
